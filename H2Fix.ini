; H2Fix settings (copy next to hitman2.exe)

[Fixes]
; cap the engine main loop; the game breaks at the thousands of fps modern PCs reach (0 = off)
FpsLimit=60

[Display]
; borderless = windowed fullscreen at desktop resolution (instant alt-tab), fullscreen = exclusive mode,
; windowed = normal window of the size given by Resolution
Mode=borderless
; render resolution (fullscreen/windowed): empty = "Resolution" from Hitman2.ini, auto = desktop, or WxH
; (borderless always uses the monitor's resolution)
Resolution=auto
; Hor+ field of view: keep the vertical FOV the game has at 4:3 and show more on the sides
HorPlus=1
; extra field of view multiplier (on tan(fov/2)), 1.0 = default
FovScale=1.0
; UI scaling: menus and HUD are laid out on a virtual screen this many pixels tall and scaled up
; (600 = like the original 800x600, 480 = menus fill the screen height, 0 = off / tiny native pixels)
UIHeight=600

[Editor]
; virtual-key code that opens/closes the editor overlay (0x77 = F8)
ToggleKey=0x77
; node flag bit used to hide objects (the renderer skips nodes with 0x200C00 set)
HideFlag=0x800

[Debug]
; periodic fps / file IO / stall statistics in H2Fix.log
Diagnostics=1
; log every file the game opens
LogFiles=0
; when no frame completes for 0.5 s, log the main thread's stack (debugging hangs)
StallWatchdog=0
; save Screens\shot_<seconds>.bmp every N seconds (0 = off, testing aid)
ScreenshotEvery=0
; expose raw memory access (h2.mem) to Lua scripts (reverse engineering aid, never for released levels)
LuaMemory=0
; log cameras, projections and viewports (reverse engineering aid)
LogRender=0
; developer automation: runs Mods\_cmd.lua every frame it appears (result: Mods\_cmd.out) and
; allows injected keys / mouse / editor clicks and back-buffer screenshots (tools/dev.py);
; the game then also keeps running and playing sound without window focus
DevCommands=0
